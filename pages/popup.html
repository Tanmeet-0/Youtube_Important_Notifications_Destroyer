<html>

    <head>
        <title>Youtube Important Notifications Destroyer</title>
        <style>
            body {
                background-color: black;
                color: white;
                width: 400px;
                text-align: center;
                margin-top: 15px;
                margin-bottom: 20px;
                font-family: Verdana;
            }

            button {
                background-color: rebeccapurple;
                border-style: solid;
                border-width: 4;
                margin-left: 5px;
                margin-right: 5px;
                padding-top: 2px;
                color: white;
            }

            button.selected {
                border-color: green;
                border-width: 4;
                border-style: solid;
            }

            .section_break {
                padding: 13px;
            }
        </style>
    </head>

    <body>
        <script src="../scripts/popup.js"></script>

        <h2> Restructure Important Notifications </h2>
        <button id="enable_restructuring_notifications">YES</button>
        <button id="disable_restructuring_notifications">NO</button>
        <div class="section_break"></div>

        <h2> Highlight Important Notifications</h2>
        <button id="enable_highlighting_important_notification">YES</button>
        <button id="disable_highlighting_important_notification">NO</button>
        <div class="section_break"></div>

        <h2>
            <label for="highlight_color">
                Highlight Colour
            </label>
        </h2>
        <input id="highlight_color" type="color" alpha>
        <div class="section_break"></div>
    </body>

</html>
