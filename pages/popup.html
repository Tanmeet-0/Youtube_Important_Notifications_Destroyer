<html>

    <head>
        <title>Youtube Important Notifications Destroyer</title>
        <style>
            body {
                background-color: black;
                color: white;
                width: 400px;
                text-align: center;
                margin-top: 15px;
                margin-bottom: 20px;
                font-family: Verdana;
            }

            button {
                background-color: rebeccapurple;
                border-style: solid;
                border-width: 4;
                margin-left: 5px;
                margin-right: 5px;
                padding-top: 2px;
                color: white;
            }

            button.selected {
                border-color: green;
                border-width: 4;
                border-style: solid;
            }

            #highlight_colour_box {
                width: max-content;
                justify-self: center;
                font-size: xx-large;
            }

            .section_break {
                padding: 13px;
            }

            #highlight_colour_input_grid {
                display: grid;
                grid-template-columns: 1fr 3fr;
            }

            .highlight_colour_part_title {
                text-align: right;
                font-size: medium;
                padding-block: 8px;
            }

            .highlight_colour_part_input {
                width: 80%;
            }

            .highlight_colour_part_input__outside {
                display: block;
                align-content: center;
            }
        </style>
    </head>

    <body>
        <script src="../scripts/popup.js"></script>

        <h2> Restructure Important Notifications </h2>
        <button id="enable_restructuring_notifications">YES</button>
        <button id="disable_restructuring_notifications">NO</button>
        <div class="section_break"></div>

        <h2> Highlight Important Notifications</h2>
        <button id="enable_highlighting_important_notification">YES</button>
        <button id="disable_highlighting_important_notification">NO</button>
        <div class="section_break"></div>

        <h2> Highlight Colour</h2>
        <div id="highlight_colour_box">
            COLOUR
        </div>
        <div class="section_break"></div>

        <div id="highlight_colour_input_grid">
            <label class="highlight_colour_part_title" for="highlight_colour_red_part">
                RED
            </label>
            <div class="highlight_colour_part_input__outside">
                <input type="range" min="0" max="255" step="1" id="highlight_colour_red_part"
                    class="highlight_colour_part_input">
            </div>

            <label class="highlight_colour_part_title" for="highlight_colour_green_part">
                GREEN
            </label>
            <div class="highlight_colour_part_input__outside">
                <input type="range" min="0" max="255" step="1" id="highlight_colour_green_part"
                    class="highlight_colour_part_input">
            </div>

            <label class="highlight_colour_part_title" for="highlight_colour_blue_part">
                BLUE
            </label>
            <div class="highlight_colour_part_input__outside">
                <input type="range" min="0" max="255" step="1" id="highlight_colour_blue_part"
                    class="highlight_colour_part_input">
            </div>
        </div>
    </body>

</html>
